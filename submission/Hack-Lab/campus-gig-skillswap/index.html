<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#86224e" />
  <meta name="description" content="A trusted campus marketplace for student skills, gigs, and skill swaps." />
  <title>CampusLoop — Student Gigs & SkillSwap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="CampusLoop home">
        <span class="brand-mark"><span></span><span></span><span></span><span></span></span>
        <span>campus<span class="brand-accent">loop</span><small>STUDENT SKILL NETWORK</small></span>
      </a>
      <div class="campus-pill"><span class="online-dot"></span> MUET COMMUNITY</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="discover"><span class="nav-icon">⌕</span> Discover gigs</button>
        <button class="nav-item" data-view="my-gigs"><span class="nav-icon">▤</span> My gigs <span id="myGigsCount" class="nav-count">0</span></button>
        <button class="nav-item" data-view="applications"><span class="nav-icon">↗</span> Applications</button>
        <button class="nav-item" data-view="profile"><span class="nav-icon">◎</span> My profile</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-card"><div class="help-spark">✦</div><strong>Your skills have value.</strong><p>Share what you know. Learn what you don't.</p><button id="helpPostBtn">Post your first gig <span>↗</span></button></div>
        <div class="user-mini"><div id="sidebarAvatar" class="avatar avatar-purple">IL</div><div class="user-mini-text"><strong id="sidebarName">Ilsa Iftikhar</strong><span id="sidebarMajor">Software Engineering</span></div><button id="editProfileQuick" class="icon-button" aria-label="Edit profile">•••</button></div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumbs"><span>Workspace</span><span class="crumb-slash">/</span><strong id="breadcrumbCurrent">Discover gigs</strong></div>
        <div class="top-actions">
          <label class="demo-switch-label" for="demoUserSwitch">Demo as</label><select id="demoUserSwitch" class="demo-user-switch" aria-label="Switch demo student account"><option value="1">Loading students…</option></select>
          <span class="top-campus"><span class="online-dot"></span> Jamshoro campus</span>
          <button id="topPostBtn" class="button button-primary"><span>＋</span> Post a gig</button>
        </div>
      </header>
      <section id="viewRoot" class="view-root" aria-live="polite">
        <div class="loading-state">Getting the campus community ready…</div>
      </section>
      <footer class="footer"><span>© 2026 CampusLoop</span><span>Made for students, by students <span class="footer-heart">♥</span></span></footer>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
